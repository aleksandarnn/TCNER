[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tcner-xai"
version = "2.0.0"
description = "Explainable venue recommendation for paper titles: a ground-truth benchmark of LIME, SHAP, Anchors and counterfactuals, evaluated with Co-12."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Aleksandar Nikolov" }, { name = "Daan Schram" }]

[tool.setuptools.packages.find]
where = ["src"]
